name: Build Flutter Web

on:
  push:
    branches: [ main, master, v2-ui-redesign ]
  pull_request:
    branches: [ main, master, v2-ui-redesign ]
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Build Flutter Web (Release)
        run: flutter build web --release

      - name: Zip Web Distribution
        run: |
          cd build/web
          zip -r -9 ../../mn-family-web-build.zip .
          cd ../..

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNFamilyApp-Web-Build
          path: build/web
          retention-days: 30

      - name: Upload Web Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNFamilyApp-Web-Zip
          path: mn-family-web-build.zip
          retention-days: 30

