<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#000000" rx="40" />

  <!-- Outer Interlocking Heart / Diamond Line -->
  <path d="M 250,150 
           L 440,225 
           L 250,425 
           L 60,225 
           L 250,150 Z" 
        fill="none" 
        stroke="url(#goldGradient)" 
        stroke-width="16" 
        stroke-linejoin="miter" 
        stroke-miterlimit="10" />

  <!-- Secondary Inner Interlocking Line -->
  <path d="M 250,195 
           L 380,245 
           L 250,375 
           L 120,245 
           L 250,195 Z" 
        fill="none" 
        stroke="url(#goldGradient)" 
        stroke-width="14" 
        stroke-linejoin="miter" 
        stroke-miterlimit="10" />

  <!-- Innermost Chevron Base Layer -->
  <path d="M 250,235 
           L 325,265 
           L 250,335 
           L 175,265 
           L 250,235 Z" 
        fill="#0b0b0e" 
        stroke="url(#goldGradient)" 
        stroke-width="10" 
        stroke-linejoin="miter" />

  <!-- MN Core Monogram -->
  <text x="250" y="270" 
        font-family="'Plus Jakarta Sans', 'Montserrat', 'Arial', sans-serif" 
        font-size="64" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        dominant-baseline="central" 
        letter-spacing="2">MN</text>
</svg>
