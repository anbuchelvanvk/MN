# Netlify Configuration for MN Family App (Flutter Web)

[build]
  publish = "build/web"
  # Optional build command if building from source on Netlify:
  command = "if [ ! -d 'flutter' ]; then git clone https://github.com/flutter/flutter.git --depth 1 -b stable flutter; fi && ./flutter/bin/flutter build web --release --base-href '/'"

[build.environment]
  FLUTTER_CHANNEL = "stable"

# Single-Page Application (SPA) redirect rule:
# Rewrites all requests to /index.html so Flutter's Navigator router handles routing seamlessly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

